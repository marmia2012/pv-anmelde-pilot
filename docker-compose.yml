# Nur für die lokale Entwicklung: Postgres ohne Passwort, nur auf localhost erreichbar.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pvautopilot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
